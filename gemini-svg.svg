<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>

    <!-- Subtle Blue Ambient Radial Accent -->
    <radialGradient id="blue-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Minimal Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="0.6" opacity="0.4"/>
    </pattern>

    <!-- Subtitle Subtle Accent Gradient -->
    <linearGradient id="blue-accent-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#388BFD"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bg-gradient)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#blue-glow)"/>

  <!-- Left Subtle Framing Line -->
  <line x1="160" y1="130" x2="160" y2="270" stroke="#388BFD" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Main Content Group -->
  <g transform="translate(190, 0)">
    <!-- Name / Main Heading -->
    <text x="0" y="180" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" 
          font-size="52" 
          font-weight="700" 
          fill="#F0F6FC" 
          letter-spacing="-1">
      Hassan Khaliq
    </text>

    <!-- Subtitle -->
    <text x="0" y="222" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" 
          font-size="22" 
          font-weight="500" 
          fill="url(#blue-accent-text)" 
          letter-spacing="1.5">
      Full-Stack Developer
    </text>

    <!-- Divider Line -->
    <line x1="0" y1="248" x2="360" y2="248" stroke="#30363D" stroke-width="1"/>

    <!-- Tech Stack Line -->
    <text x="0" y="278" 
          font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace" 
          font-size="15" 
          font-weight="400" 
          fill="#8B949E" 
          letter-spacing="0.5">
      React <tspan fill="#388BFD">·</tspan> Node.js <tspan fill="#388BFD">·</tspan> MongoDB <tspan fill="#388BFD">·</tspan> Python
    </text>
  </g>
</svg>
